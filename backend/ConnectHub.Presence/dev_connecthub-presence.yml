name: Build and deploy ASP.Net Core app to Azure Web App - connecthub-presence

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore ./backend/ConnectHub.Presence/ConnectHub.Presence.csproj

      - name: Build
        run: dotnet build ./backend/ConnectHub.Presence/ConnectHub.Presence.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./backend/ConnectHub.Presence/ConnectHub.Presence.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'connecthub-presence'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PRESENCE }}
          package: ./publish